<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Dhruv Vedwal — Full-Stack Developer and AI Builder</title>
  <desc id="desc">An animated developer profile banner with a subtle grid, moving signal line, and product-building tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="38%" stop-color="#60a5fa" stop-opacity=".7"/>
      <stop offset="50%" stop-color="#a5f3fc" stop-opacity="1"/>
      <stop offset="62%" stop-color="#60a5fa" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94a3b8" stroke-opacity=".08" stroke-width="1"/>
      <circle cx="1" cy="1" r="1.2" fill="#94a3b8" fill-opacity=".14"/>
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect x="0" y="0" width="1400" height="360" rx="24"/></clipPath>
    <style>
      .signal { animation: drift 7s ease-in-out infinite; transform-origin: 700px 190px; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .float { animation: float 5.5s ease-in-out infinite; }
      @keyframes drift { 0%,100% { transform: translateX(-90px); opacity:.35; } 50% { transform: translateX(90px); opacity:1; } }
      @keyframes pulse { 0%,100% { opacity:.3; } 50% { opacity:.85; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1400" height="360" fill="url(#bg)"/>
    <rect width="1400" height="360" fill="url(#grid)"/>

    <circle cx="1080" cy="95" r="95" fill="#38bdf8" fill-opacity=".06" filter="url(#blur)"/>
    <circle cx="1250" cy="280" r="120" fill="#818cf8" fill-opacity=".05" filter="url(#blur)"/>

    <g class="signal" filter="url(#glow)">
      <path d="M-120 210 C160 145 270 285 500 212 S850 138 1110 210 S1350 265 1530 183" fill="none" stroke="url(#signal)" stroke-width="2.5"/>
      <circle cx="700" cy="177" r="4" fill="#dbeafe"/>
    </g>

    <g class="float">
      <rect x="76" y="58" width="8" height="8" rx="2" fill="#67e8f9" fill-opacity=".7"/>
      <rect x="1160" y="82" width="6" height="6" rx="2" fill="#93c5fd" fill-opacity=".75"/>
      <rect x="1288" y="218" width="8" height="8" rx="2" fill="#a5b4fc" fill-opacity=".6"/>
    </g>

    <text x="78" y="112" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="4">DHRUV VEDWAL</text>
    <text x="78" y="184" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5">I BUILD SOFTWARE.</text>
    <text x="78" y="228" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Full-stack engineering, AI agents &amp; the occasional rabbit hole.</text>

    <g opacity=".85" class="pulse">
      <rect x="1062" y="122" width="250" height="110" rx="18" fill="#0b1220" fill-opacity=".72" stroke="#64748b" stroke-opacity=".22"/>
      <text x="1086" y="153" fill="#64748b" font-family="ui-monospace, monospace" font-size="13">CURRENTLY</text>
      <text x="1086" y="183" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="19">building ProductLens</text>
      <text x="1086" y="209" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="13">agents → browser → demos</text>
    </g>

    <line x1="78" y1="278" x2="1322" y2="278" stroke="#cbd5e1" stroke-opacity=".11"/>
    <text x="78" y="313" fill="#64748b" font-family="ui-monospace, monospace" font-size="12">typescript · react · next.js · node · python · playwright · llms</text>
    <text x="1322" y="313" fill="#64748b" font-family="ui-monospace, monospace" font-size="12" text-anchor="end">build / break / learn / repeat</text>
  </g>
</svg>
