name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile-cards
  cancel-in-progress: false

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        id: stats
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: activity-consistency
      - name: Publish activity cards
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: |
          mkdir -p profile
          cp "$READY_DIR"/activity-consistency-*.svg profile/
          git add profile/activity-consistency-*.svg
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git diff --cached --quiet || (git commit -m "Update GitHub activity cards" && git push)

  languages:
    needs: activity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        id: stats
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: language-composition
      - name: Publish language cards
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: |
          mkdir -p profile
          cp "$READY_DIR"/language-composition-*.svg profile/
          git add profile/language-composition-*.svg
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git diff --cached --quiet || (git commit -m "Update GitHub language cards" && git push)
