name: Update GitHub trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-github-trophies
  cancel-in-progress: false

jobs:
  trophies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate trophy SVG
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=${{ github.repository_owner }}&theme=flat&no-frame=true&no-bg=true&row=1&column=6&margin-w=8"
          path: assets/trophy.svg
          token: ${{ github.token }}
      - name: Commit trophy
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/trophy.svg
          git diff --cached --quiet || (git commit -m "Update GitHub trophies" && git push)
