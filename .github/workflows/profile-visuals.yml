name: Update profile visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile-visuals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate signal field
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835
        id: signal
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: signal-field

      - name: Generate activity consistency
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835
        id: activity
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: activity-consistency

      - name: Generate language composition
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835
        id: languages
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: language-composition

      - name: Publish profile cards
        env:
          SIGNAL_DIR: ${{ steps.signal.outputs.ready-dir }}
          ACTIVITY_DIR: ${{ steps.activity.outputs.ready-dir }}
          LANGUAGES_DIR: ${{ steps.languages.outputs.ready-dir }}
        run: |
          mkdir -p profile

          cp "$SIGNAL_DIR"/signal-field-*.svg profile/
          cp "$ACTIVITY_DIR"/activity-consistency-*.svg profile/
          cp "$LANGUAGES_DIR"/language-composition-*.svg profile/

          test -s profile/signal-field-wide-light.svg
          test -s profile/signal-field-wide-dark.svg
          test -s profile/activity-consistency-wide-light.svg
          test -s profile/activity-consistency-wide-dark.svg
          test -s profile/language-composition-wide-light.svg
          test -s profile/language-composition-wide-dark.svg

      - name: Generate GitHub trophies
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: ${{ github.repository_owner }}
          output_path: assets/trophy.svg
          token: ${{ github.token }}

      - name: Validate trophy
        run: test -s assets/trophy.svg

      - name: Commit generated visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile assets/trophy.svg

          if git diff --cached --quiet; then
            echo "No visual changes."
            exit 0
          fi

          git commit -m "Update profile visuals"
          git push
